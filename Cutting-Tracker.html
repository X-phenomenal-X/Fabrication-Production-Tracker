<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="color-scheme" content="light dark">
  <!-- Add to Home Screen on a phone: opens without browser chrome. Both the
       manifest and the icon are ignored when the file is opened from a shared
       drive, which is why neither is required for the app to work. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cutting">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Cutting — BV Glazing Production Tracker</title>
  <style>
/* BV Cutting — department tracker */

:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --panel-2: #f7f9fb;
  --line: #d8dee7;
  --line-soft: #e8ecf1;
  --ink: #131c26;
  --ink-2: #55657a;
  /* #64748b, not the lighter grey this used to be: at 2.9:1 on white the old
     value failed WCAG AA, and this token carries most of the secondary text on
     the page — stat labels, dates, counts. Under shop lighting and glare that
     is the difference between readable and squinted at. Now 4.8:1. */
  --ink-3: #64748b;

  --accent: #1667d8;
  --accent-soft: #e7f0fd;
  --ok: #16794a;
  --ok-soft: #e2f4ea;
  --warn: #9d5c06;
  --warn-soft: #fdf0dc;
  --bad: #bc3119;
  --bad-soft: #fde9e5;
  --work: #6438bf;
  --work-soft: #efe9fc;

  /* Elevation. Defined as tokens because dark mode cannot use the same
     shadows — a black shadow on a near-black surface is invisible, which is
     why the dark theme used to read completely flat. */
  --shadow-1: 0 1px 2px rgba(19,28,38,.06);
  --shadow-2: 0 1px 2px rgba(19,28,38,.05), 0 4px 12px rgba(19,28,38,.06);
  --shadow-3: 0 2px 6px rgba(19,28,38,.08), 0 12px 32px rgba(19,28,38,.14);
  /* A hairline of light along the top edge; reads as a raised surface without
     costing any contrast. Transparent in light mode, where shadow does the job. */
  --sheen: transparent;

  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent);

  --radius: 10px;
  --r-sm: 7px;
  --r-lg: 14px;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1319;
    --panel: #161e27;
    --panel-2: #1b242e;
    --line: #2c3846;
    --line-soft: #222c37;
    --ink: #e8eff6;
    --ink-2: #a3b5c7;
    --ink-3: #7d90a3;          /* 5.1:1 on --panel; the old value was 4.2:1 */

    --accent: #5b9dff;
    --accent-soft: #16294180;
    --ok: #4fd093;
    --ok-soft: #10331f80;
    --warn: #e5a94f;
    --warn-soft: #35270f80;
    --bad: #ff8069;
    --bad-soft: #3d1b1480;
    --work: #b393f5;
    --work-soft: #261b4080;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 2px 6px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.32);
    --shadow-3: 0 8px 24px rgba(0,0,0,.5), 0 24px 56px rgba(0,0,0,.36);
    --sheen: inset 0 1px 0 rgba(255,255,255,.045);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Numbers are read against each other constantly here — quantities down a
   column, counts across a stat strip — so they line up by default rather than
   per-component. */
.mono, .cstat b, .stat .n, .subtab-count, .dgroup-count, .line-qty,
input[type="number"], .nowrun-meta, td.num, th.num {
  font-variant-numeric: tabular-nums;
}

/* Keyboard focus was invisible before this: the only focus styling was on
   inputs. Everything interactive now shows the same ring, and only for
   keyboard users, so pointer users never see it. */
:focus-visible {
  outline: none;
  box-shadow: var(--ring);
  border-radius: var(--r-sm);
}
input:focus-visible, select:focus-visible, textarea:focus-visible {
  border-radius: 8px;
}

/* ---------- layout ---------- */

.app { display: flex; flex-direction: column; min-height: 100vh; }

header.top {
  position: sticky; top: 0; z-index: 40;
  /* Slightly translucent so content scrolling under it stays sensed rather
     than hard-clipped; the solid fallback matters because backdrop-filter is
     the one thing here that silently does nothing on older Edge. */
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  -webkit-backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
@supports not (backdrop-filter: blur(1px)) {
  header.top { background: var(--panel); }
}

.brand {
  font-weight: 700; letter-spacing: -0.015em; font-size: 15px;
  display: flex; align-items: baseline; gap: 9px;
}
/* The department name carries a mark in the accent so the header has one
   fixed point the eye can return to. */
.brand::before {
  content: ''; align-self: center;
  width: 9px; height: 18px; border-radius: 3px; margin-right: 1px;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--work)));
}
.brand small { font-weight: 500; color: var(--ink-3); font-size: 12px; letter-spacing: 0; }

nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
nav.tabs button {
  position: relative;
  border: 1px solid transparent; background: none; color: var(--ink-2);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500;
  transition: color .14s, background .14s;
}
nav.tabs button:hover { background: var(--panel-2); color: var(--ink); }
nav.tabs button[aria-current="true"] {
  background: var(--accent-soft); color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 22%, transparent);
  font-weight: 600;
}

main { flex: 1; padding: 20px 18px 18px; max-width: 1500px; width: 100%; margin: 0 auto; }

/* ---------- primitives ---------- */

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-1), var(--sheen);
}
.panel + .panel { margin-top: 16px; }
.panel > h2, .panel > header {
  margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
  font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2);
  display: flex; align-items: center; gap: 10px; font-weight: 700;
}
.panel > header h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.panel .body { padding: 16px; }
.panel .body.flush { padding: 0; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { margin-left: auto; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

button, .btn {
  font: inherit; font-weight: 550; cursor: pointer;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px;
  box-shadow: var(--shadow-1);
  transition: border-color .14s, background .14s, box-shadow .14s, transform .1s;
}
button:hover:not(:disabled) { border-color: var(--ink-3); box-shadow: var(--shadow-2); }
/* A press that visibly gives is worth more here than anywhere else: with
   gloves on, the tap feedback is most of the confirmation you get. */
button:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--shadow-1); }
button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
button.primary {
  background: var(--accent); border-color: transparent; color: #fff;
  box-shadow: var(--shadow-1), 0 1px 3px color-mix(in srgb, var(--accent) 40%, transparent);
}
button.primary:hover:not(:disabled) {
  filter: brightness(1.07);
  box-shadow: var(--shadow-2), 0 2px 8px color-mix(in srgb, var(--accent) 45%, transparent);
}
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
button.ghost { border-color: transparent; background: none; color: var(--ink-2); }
button.ghost:hover { background: var(--panel-2); color: var(--ink); }
button.sm { padding: 4px 9px; font-size: 12px; }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { resize: vertical; min-height: 70px; line-height: 1.55; }
label.field { display: block; }
label.field > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line-soft);
  white-space: nowrap;
}
.chip.ok   { background: var(--ok-soft);   color: var(--ok);   border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad  { background: var(--bad-soft);  color: var(--bad);  border-color: transparent; }
.chip.work { background: var(--work-soft); color: var(--work); border-color: transparent; }
.chip.mute { background: var(--panel-2);   color: var(--ink-3); }

.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }

/* ---------- stats ---------- */

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 1px; background: var(--line-soft); }
.stat { background: var(--panel); padding: 12px 14px; }
.stat .n { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-top: 2px; font-weight: 600; }
.stat.bad .n { color: var(--bad); }
.stat.warn .n { color: var(--warn); }
.stat.ok .n { color: var(--ok); }

/* ---------- tables ---------- */

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th {
  position: sticky; top: 0; background: var(--panel-2); z-index: 2;
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3);
  font-weight: 600; white-space: nowrap;
}
tbody tr:hover { background: var(--panel-2); }
tbody tr.sel { background: var(--accent-soft); }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }

/* ---------- progress ---------- */

.bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; min-width: 54px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.done > i { background: var(--ok); }

.oprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.oprow:last-child { border-bottom: 0; }
.oplabel { width: 120px; font-weight: 600; font-size: 12.5px; flex-shrink: 0; }
.opqty { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); width: 86px; text-align: right; flex-shrink: 0; }
.opinput { width: 76px; flex-shrink: 0; }
.opinput input { padding: 5px 8px; text-align: right; font-family: var(--mono); }

/* ---------- misc ---------- */

.empty { padding: 34px 16px; text-align: center; color: var(--ink-3); }
.empty h3 { margin: 0 0 6px; color: var(--ink-2); font-size: 15px; }

.drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 34px; text-align: center; color: var(--ink-2); background: var(--panel-2);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.info { background: var(--accent-soft); color: var(--accent); }

dialog {
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0;
  background: var(--panel); color: var(--ink);
  max-width: 640px; width: calc(100% - 32px);
  box-shadow: var(--shadow-3), var(--sheen);
  animation: dialogin .16s cubic-bezier(.4,0,.2,1);
}
@keyframes dialogin { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
dialog::backdrop { background: rgba(8,12,16,.55); backdrop-filter: blur(2px); }
dialog header { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); font-weight: 650; display: flex; align-items: center; }
dialog .body { padding: 18px; max-height: 65vh; overflow: auto; }
dialog footer { padding: 12px 18px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; }

.doc { line-height: 1.65; }
.doc h3 { margin: 18px 0 6px; font-size: 15px; }
.doc h4 { margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
.doc li { margin: 3px 0; }
.doc p { margin: 8px 0; }
.doc code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 11px 19px; border-radius: 999px;
  font-size: 13px; font-weight: 550; z-index: 100; box-shadow: var(--shadow-3);
  animation: toastin .18s cubic-bezier(.4,0,.2,1);
}
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.list li:last-child { border-bottom: 0; }

.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- phone ---------- */

@media (max-width: 720px) {
  main { padding: 12px; }
  header.top { padding: 8px 12px; gap: 8px; }

  /* The header was costing ~150px before any content on a 390px-wide phone:
     brand and chips wrapping, then the nav, then the name picker alone on a
     third row. Sending the nav last lets brand, chips and picker share the
     top row, and dropping the tagline — decoration — buys the rest. */
  nav.tabs { order: 10; }
  .brand small { display: none; }
  .brand { font-size: 14px; }
  header.top > div:last-of-type { margin-left: auto !important; }
  header.top select { padding: 5px 8px; font-size: 13px; }

  /* Eight tabs wrap to three rows and eat the screen; one scrolling row keeps
     the header the same height however many pages there are. */
  nav.tabs { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { padding: 7px 11px; font-size: 13px; white-space: nowrap; }

  .hide-sm { display: none !important; }
  .oplabel { width: 88px; }
  .stat .n { font-size: 19px; }
  .cstat { padding: 8px 6px; min-width: 0; }
  .cstat b { font-size: 19px; }
  .centre-title { font-size: 22px; }
}

/* ---------- work-centre page ---------- */

.centre { padding-bottom: 90px; animation: pagein .18s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.centre-head {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 16px 0 12px;
  margin: -20px 0 4px;
  border-bottom: 1px solid var(--line);
}
@supports not (backdrop-filter: blur(1px)) {
  .centre-head { background: var(--bg); }
}
.centre-title-row { gap: 16px; }
.centre-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; border-radius: 7px;
  background: none; border: 1px solid transparent; color: var(--ink-3); cursor: pointer;
  transition: color .12s, background .12s, border-color .12s;
}
.iconbtn:hover { color: var(--ink); background: var(--panel-2); border-color: var(--line); }

.centre-stats {
  display: flex; gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-1), var(--sheen);
}
.cstat { background: var(--panel); padding: 9px 16px; text-align: center; min-width: 70px; }
/* These five numbers are the whole reason to look at the top of the page, so
   they are sized to be read from a step back rather than leaned into. */
.cstat b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.cstat i {
  display: block; font-style: normal; font-size: 10px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-3); font-weight: 700; margin-top: 2px;
}
/* A zero is good news on every one of the coloured stats, so it stays neutral
   and only a real count takes the alarm colour. */
.cstat.bad b  { color: var(--bad); }
.cstat.work b { color: var(--work); }
.cstat.warn b { color: var(--warn); }

.progress {
  height: 5px; border-radius: 999px; background: var(--line-soft);
  overflow: hidden; margin-top: 13px;
}
.progress > i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ok) 78%, var(--accent)), var(--ok));
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
.progress-cap { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; font-weight: 500; }

/* sub-tabs */

.subtabs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 13px; }
.subtabs button {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer;
  transition: background .14s, color .14s, border-color .14s, transform .1s;
}
.subtabs button:hover { border-color: var(--ink-3); color: var(--ink); }
.subtabs button:active { transform: scale(.97); }
.subtabs button[aria-current="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 1px 5px color-mix(in srgb, var(--accent) 35%, transparent);
}
.subtab-count {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.subtabs button[aria-current="true"] .subtab-count { background: rgba(255,255,255,.24); color: #fff; }

/* filters */

.centre-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.searchwrap { position: relative; flex-shrink: 0; }
.searchwrap input { width: 260px; padding-left: 32px; }
.searchicon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }

.filterpills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill {
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: none; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill[aria-current="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.donetoggle { gap: 6px; color: var(--ink-2); cursor: pointer; }
.donetoggle input { width: auto; }

/* date groups */

.dgroup { margin-top: 18px; }
.dgroup-head { display: flex; align-items: center; gap: 8px; padding: 2px; }
.dgroup-toggle {
  display: flex; align-items: center; gap: 9px;
  background: none; border: none; padding: 3px 2px; cursor: pointer; font: inherit;
}
.dgroup-caret { color: var(--ink-3); display: inline-flex; transition: transform .18s cubic-bezier(.4,0,.2,1); }
.dgroup-caret.open { transform: rotate(90deg); }
.dgroup-label {
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-2); transition: color .12s;
}
.dgroup-toggle:hover .dgroup-label { color: var(--ink); }
.dgroup-label.bad { color: var(--bad); }
.dgroup-label.warn { color: var(--warn); }
.dgroup-count {
  font-size: 11px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums;
  background: var(--panel-2); border: 1px solid var(--line-soft);
  padding: 1px 8px; border-radius: 999px;
}
.dgroup-pick {
  background: none; border: none; color: var(--ink-3); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 3px 8px; border-radius: 6px;
}
.dgroup-pick:hover { color: var(--accent); background: var(--accent-soft); }
.dgroup-body {
  margin-top: 8px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
  box-shadow: var(--shadow-1), var(--sheen);
}

/* a scheduled line */

.line {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 14px; border-bottom: 1px solid var(--line-soft);
  transition: background .12s, box-shadow .12s;
}
.line:last-of-type { border-bottom: 0; }
.line:hover { background: var(--panel-2); }
/* A selected row is picked out by a spine as well as a tint: the tint alone is
   the same cue the rush and running states already use, and on a glared screen
   three tints are hard to tell apart. */
.line.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

.line-pick { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
.line-pick input { width: 17px; height: 17px; cursor: pointer; accent-color: var(--accent); }

.line-main { flex: 1; min-width: 0; }
.line-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* The work order is what anyone is scanning for down a long list, so it is the
   heaviest thing on the row. */
.line-id .mono { font-size: 15px; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); }
.die {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 7px; border-radius: 5px; letter-spacing: -0.01em;
  border: 1px solid color-mix(in srgb, var(--accent) 16%, transparent);
}
.badge-bo {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .04em;
  background: var(--bad-soft); color: var(--bad); padding: 2px 7px; border-radius: 5px;
}
.line-where { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.line-note { margin-top: 3px; }
.line-usernote {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 5px;
  font-size: 12.5px; color: var(--ink-2);
  background: var(--warn-soft); border-radius: 6px; padding: 4px 8px;
}
.line-usernote svg { flex-shrink: 0; margin-top: 2px; color: var(--warn); }

.line-qty { flex-shrink: 0; text-align: right; min-width: 62px; display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
.line-qty .mono { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.line-date { flex-shrink: 0; width: 68px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }

.line-tools { flex-shrink: 0; display: flex; gap: 2px; }
.line-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border-radius: 7px;
  background: none; border: 1px solid transparent; color: var(--ink-3); cursor: pointer;
  transition: color .12s, background .12s, border-color .12s;
}
.line-iconbtn:hover { color: var(--ink); background: var(--panel); border-color: var(--line); }
.line-iconbtn.has { color: var(--warn); }

/* segmented status control */

.line-status { flex-shrink: 0; }
.seg {
  display: inline-flex; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px;
}
.seg-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: 7px; border: none; background: none;
  color: var(--ink-3); font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
}
.seg-btn:hover { color: var(--ink); background: var(--panel); }
.seg-btn .seg-label { display: none; }
.seg-btn.on { background: var(--panel); box-shadow: 0 1px 3px rgba(16,24,32,.12); }
.seg-btn.on .seg-label { display: inline; }
.seg-btn.on.mute { color: var(--ink-2); }
.seg-btn.on.work { color: var(--work); background: var(--work-soft); box-shadow: none; }
.seg-btn.on.ok   { color: var(--ok);   background: var(--ok-soft);   box-shadow: none; }

.showmore { margin: 10px 14px 12px; }

/* bulk action bar */

.bulkbar {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; z-index: 60;
  background: var(--ink); color: var(--bg);
  padding: 9px 10px 9px 18px; border-radius: 999px;
  box-shadow: 0 10px 34px rgba(0,0,0,.3);
  animation: bulkin .18s cubic-bezier(.4,0,.2,1);
}
@keyframes bulkin { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.bulk-count { font-size: 13px; font-weight: 600; white-space: nowrap; }
.bulkbar .spacer { margin-left: 4px; }
.bulk-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.14); border: none; color: inherit;
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .12s;
}
.bulk-btn:hover { background: rgba(255,255,255,.28); }
.bulk-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border-radius: 999px;
  background: none; border: none; color: inherit; opacity: .65; cursor: pointer;
}
.bulk-x:hover { opacity: 1; background: rgba(255,255,255,.14); }

/* shift update */

.su {
  margin-top: 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
  box-shadow: 0 1px 2px rgba(16,24,32,.04);
}
.su.down { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.su-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
  background: var(--panel-2);
}
.su-title { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.badge-down {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  background: var(--bad); color: #fff; padding: 3px 9px; border-radius: 999px;
}
.su-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; padding: 13px 15px; }
.su-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 5px; }
.su-list { margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.65; }
.su-list li { margin: 2px 0; }

/* empty state */

.empty-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--panel-2); color: var(--ink-3); margin-bottom: 12px;
}

/* toast with an action */

.toast-action { display: flex; align-items: center; gap: 14px; padding-right: 8px; }
.toast-action button {
  background: rgba(255,255,255,.18); border: none; color: inherit;
  padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.toast-action button:hover { background: rgba(255,255,255,.32); }

@media (max-width: 860px) {
  .seg-btn { padding: 8px 9px; }
  .seg-btn.on .seg-label { display: none; }
}

@media (max-width: 720px) {
  .centre-head { position: static; margin: -12px 0 4px; }
  .centre-title { font-size: 19px; }
  .centre-stats { width: 100%; }
  .cstat { flex: 1; min-width: 0; padding: 7px 4px; }
  .searchwrap { flex: 1; }
  .searchwrap input { width: 100%; }
  .line { flex-wrap: wrap; gap: 9px; padding: 12px; }
  .line-main { flex-basis: calc(100% - 34px); }
  .line-status { margin-left: auto; }
  .seg-btn { padding: 9px 12px; }
  .bulkbar { left: 12px; right: 12px; transform: none; border-radius: 14px; }
  @keyframes bulkin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- edited lines & history ---------- */

.badge-edited {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 7px; border-radius: 5px;
}
.die.edited { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }

.edithead {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft);
}
.editfield > span { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.edited-tag {
  font-style: normal; font-size: 10.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  padding: 1px 6px; border-radius: 4px;
}

.hist-title {
  margin: 20px 0 8px; font-size: 12px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2);
}
.hist {
  list-style: none; margin: 0; padding: 0;
  border: 1px solid var(--line-soft); border-radius: 8px;
  max-height: 240px; overflow: auto;
}
.hist li { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.hist li:last-child { border-bottom: 0; }
.hist-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.hist-kind {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); min-width: 54px;
}
.hist-field {
  font-family: var(--mono); font-size: 11.5px;
  background: var(--panel-2); padding: 1px 6px; border-radius: 4px; color: var(--ink-2);
}
.hist-change { color: var(--ink); }
.hist-who { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ---------- back orders ---------- */

.line-boband {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 5px;
  font-size: 12.5px; color: var(--bad);
  background: var(--bad-soft); border-radius: 6px; padding: 4px 8px;
}
.line-boband svg { flex-shrink: 0; margin-top: 2px; }
.line-boband .muted { color: color-mix(in srgb, var(--bad) 65%, var(--ink-3)); }

.line-iconbtn.bo { color: var(--bad); }

.bo-dialoghead {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft);
}
.bo-flagrow {
  gap: 10px; align-items: flex-start; padding: 11px 13px;
  background: var(--bad-soft); border-radius: 8px; cursor: pointer;
}
.bo-flagrow input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--bad); }
.of-total { font-style: normal; color: var(--ink-3); font-weight: 500; margin-left: 5px; }

.bo-who {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 800; letter-spacing: .03em;
  color: var(--ink); text-transform: none;
}
.bo-who.none { color: var(--warn); }

.bo-line .line-main { flex: 1; }
.bo-short { color: var(--bad); font-weight: 700; }
.line-bonote {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 4px;
  font-size: 12.5px; color: var(--ink-2);
}
.line-bonote svg { flex-shrink: 0; margin-top: 2px; color: var(--bad); }
.bo-sheetnote {
  display: flex; align-items: flex-start; gap: 6px; margin-top: 12px;
  font-size: 12.5px; color: var(--ink-2);
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 7px; padding: 8px 10px;
}
.bo-sheetnote svg { flex-shrink: 0; margin-top: 2px; color: var(--warn); }

/* ---------- shift update page ---------- */

.centre-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.dot-sep { margin: 0 6px; color: var(--ink-3); }

.linkbtn {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 0; padding: 3px 7px; border-radius: 6px;
  font-size: 11.5px; font-weight: 600; color: var(--accent); cursor: pointer;
  transition: background .14s ease;
}
.linkbtn:hover { background: var(--accent-soft); }

.su-when { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.su-when .subtabs { margin-top: 8px; }
.su-date { width: auto; padding: 6px 10px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* One card per machine. Two up on a desk monitor, one up on a tablet at the
   machine — the shift update is written on both. */
.sugrid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px; margin-top: 9px;
}

.sucard {
  position: relative;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; transition: border-color .16s ease, box-shadow .16s ease;
}
.sucard:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* A filled-in card gets a green spine, so what is left to write is obvious
   at a glance without reading any of it. Kept off box-shadow so it survives
   the focus ring. */
.sucard.filled::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--ok);
}

.sucard-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 13px; border-bottom: 1px solid var(--line-soft); background: var(--panel-2);
}
.sucard-name { font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em; }
.sucard-sub { font-size: 11px; color: var(--ink-3); }
.sucard-ops { display: flex; align-items: center; gap: 6px; }
.sucard-ops > span { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.sucard-ops input { width: 58px; padding: 4px 7px; text-align: center; font-variant-numeric: tabular-nums; }

.sucard-body { padding: 12px 13px; display: grid; gap: 11px; }
.sucard-body textarea { min-height: 0; font-size: 13px; }

.sugs { padding: 0 13px 11px; display: grid; gap: 7px; }
.sug { display: flex; align-items: flex-start; gap: 8px; }
.sug-label {
  flex-shrink: 0; width: 108px; padding-top: 4px;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); line-height: 1.3;
}
.sug-items { display: flex; flex-wrap: wrap; gap: 4px; }
.sug-chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  padding: 3px 8px; border-radius: 999px; cursor: pointer;
  font-size: 11.5px; font-weight: 500; text-align: left;
  background: var(--panel-2); color: var(--ink-2); border: 1px dashed var(--line);
  transition: all .14s ease;
}
.sug-chip:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); border-style: solid; }
.sug-chip:active { transform: scale(.97); }
.sug-chip svg { flex-shrink: 0; opacity: .55; }
.sug-chip:hover svg { opacity: 1; }
.sug-chip.used {
  background: var(--ok-soft); color: var(--ok);
  border-style: solid; border-color: transparent; cursor: default;
}
.sug-chip.used svg { opacity: 1; }
.sug-chip.used:hover { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.sug-chip.used:active { transform: none; }

.su-general { margin-top: 18px; }

/* Stays in reach at the bottom of a long page rather than scrolling away. */
.su-actions {
  position: sticky; bottom: 12px; z-index: 5;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 18px; padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 6px 22px rgba(16,24,32,.10);
}
.su-actions button { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- shift update, reading ---------- */

.suread { padding: 13px 15px; border-bottom: 1px solid var(--line-soft); }
.suread:last-child { border-bottom: 0; }
.suread-name { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.suread-name strong { font-size: 13.5px; letter-spacing: -0.01em; }
.suread-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.suread-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

.su-recent { margin-top: 20px; }
.su-recentrow {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  cursor: pointer; transition: background .14s ease;
}
.su-recentrow:hover { background: var(--panel-2); }
.su-recentrow.here { background: var(--accent-soft); }

@media (max-width: 720px) {
  .sugrid { grid-template-columns: 1fr; }
  .sug { flex-direction: column; gap: 3px; }
  .sug-label { width: auto; padding-top: 0; }
  .su-when { align-items: stretch; }
}

/* ---------- rush ---------- */

.badge-rush {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 5px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .03em;
  background: var(--warn-soft); color: var(--warn);
  white-space: nowrap;
}
/* Past its date or due inside two days: this is the one that actually needs
   picking up now, so it stops being amber. */
.badge-rush.hot { background: var(--bad-soft); color: var(--bad); }
.badge-rush svg { flex-shrink: 0; }

/* A rush line keeps a spine down its left edge, so it reads as jumping the
   queue even when the queue is scrolled past its badge. */
.line.rush { box-shadow: inset 3px 0 0 var(--warn); }
.line.rush.sel { box-shadow: inset 3px 0 0 var(--warn); }

.line-rushband {
  display: flex; align-items: flex-start; gap: 6px; margin-top: 5px;
  font-size: 12.5px; color: var(--warn);
}
.line-rushband svg { flex-shrink: 0; margin-top: 2px; color: var(--warn); }

.line-iconbtn.rush { color: var(--warn); }
.line-iconbtn.moved { color: var(--accent); }

.rush-flagrow { align-items: flex-start; gap: 10px; margin-top: 14px; }
.rush-flagrow input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--warn); }
.rush-quick { display: flex; gap: 2px; margin-top: 5px; flex-wrap: wrap; }

.rush-line .line-main { flex: 1; }
.rush-need { font-weight: 700; font-variant-numeric: tabular-nums; }
.rush-need.late { color: var(--bad); }

/* ---------- putting a line on a machine ---------- */

.movegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.movebtn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 12px 14px; text-align: left; border-radius: 9px;
}
.movebtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.movebtn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.movebtn.on .muted { color: var(--accent); opacity: .75; }

/* ---------- cloud setup ---------- */

.cloud-steps { margin: 10px 0 0; padding-left: 20px; line-height: 1.7; }
.cloud-steps li { margin: 2px 0; }
.cloud-steps .linkbtn { padding: 0 3px; font-size: inherit; }

/* ---------- running now ---------- */

/* The first thing anyone switching to a machine's tab wants to know: what is
   it actually doing right now. Sits above everything else on the page rather
   than wherever it happens to land in the date-grouped queue below. */
.nowrun {
  margin-top: 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
}
.nowrun.active { box-shadow: inset 3px 0 0 var(--work); }

.nowrun-empty {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px; background: var(--panel-2); color: var(--ink-3); font-size: 13px;
}

.nowrun-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; background: var(--work-soft); color: var(--work);
  font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
}
.nowrun-count {
  margin-left: auto; background: var(--work); color: #fff;
  border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 800;
}

.nowrun-line {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 14px; border-bottom: 1px solid var(--line-soft);
}
.nowrun-line:last-child { border-bottom: 0; }
.nowrun-main { flex: 1; min-width: 160px; }
.nowrun-meta {
  display: flex; align-items: baseline; gap: 6px; flex-shrink: 0;
  font-size: 13px;
}
.nowrun-since { white-space: nowrap; margin-left: 4px; }
.nowrun-done {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: var(--ok-soft); color: var(--ok); border: 1px solid transparent;
}
.nowrun-done:hover { background: var(--ok); color: #fff; }

@media (max-width: 720px) {
  .nowrun-line { padding: 12px; }
  .nowrun-meta { flex-basis: 100%; justify-content: space-between; }
}

/* ---------- v2 refinements ---------- */

/* The note / back-order / rush bands are annotations on a row, not content in
   their own right. Unbounded they stretch the full width of a desk monitor and
   read as separate blocks; capped, they stay attached to the line above them. */
.line-usernote, .line-boband, .line-rushband { max-width: 68ch; }

/* Sub-tabs carry the machine you are looking at — on a centre page that is the
   single most important piece of state, so the selected one is unmistakable. */
.subtabs button[aria-current="true"] {
  box-shadow: var(--shadow-2), 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent);
}
.subtabs button { box-shadow: var(--shadow-1); }

/* Group headers earn a little more weight now that rows are heavier. */
.dgroup-label { font-size: 12.5px; }

/* Alarm tones on a group header should read before the words do. */
.dgroup-label.bad  { color: var(--bad); }
.dgroup-label.warn { color: var(--warn); }

.su, .nowrun { box-shadow: var(--shadow-1), var(--sheen); }
.sucard { box-shadow: var(--shadow-1), var(--sheen); }
.bulkbar { box-shadow: var(--shadow-3); }

/* Inputs sit on the panel; against a panel-coloured background they vanished
   at a glance. A recessed field reads as somewhere to type. */
input, select, textarea { background: var(--panel-2); }
input:focus, select:focus, textarea:focus { background: var(--panel); }

/* Selection colour, so dragging over a work order looks deliberate. */
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

/* Printing a shift update or a queue for the floor is a real thing people do
   with a page like this; without help it prints the nav, the sticky headers
   and the action bar over the top of the content. */
@media print {
  header.top, nav.tabs, .bulkbar, .toast, .line-tools, .line-pick,
  .centre-filters, .subtabs, .su-actions, .showmore { display: none !important; }
  .centre-head { position: static; backdrop-filter: none; }
  body { background: #fff; }
  .panel, .dgroup-body, .nowrun, .su, .sucard { box-shadow: none; break-inside: avoid; }
  .line { break-inside: avoid; }
}

/* A line someone moved off the machine the workbook put it on. Neutral rather
   than alarming — it is a legitimate decision, just one worth being able to
   see from the machine the job left. */
.badge-moved {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 7px 2px 5px; border-radius: 5px;
  border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
}
.badge-moved svg { flex-shrink: 0; opacity: .7; }
.movebtn .muted { line-height: 1.3; }

            el("strong", {}, "Anyone with the address and the key can read and write this data. "),
            "There is no login. Keep the key to the department, the same way the network share is kept to the department."
          )
        )
      ),
      {
        wide: true,
        actions: [{
          label: "Copy SQL",
          class: "primary",
          onClick: async () => {
            try {
              await navigator.clipboard.writeText(SETUP_SQL);
              toast("SQL copied");
            } catch {
              box.select();
              toast("Select and copy the text");
            }
          }
        }]
      }
    );
  }
  function cloudSection(rerender) {
    const st = cloudStatus();
    const cfg = cloudConfig();
    const body = el("div.body", {});
    if (st.on) {
      body.append(
        el(
          "div.banner" + (st.error ? ".bad" : ".ok"),
          { style: { marginBottom: "12px" } },
          el(
            "div",
            {},
            el("strong", {}, st.error ? "Sync problem: " : "Syncing: "),
            st.error || st.where,
            el(
              "div.small",
              { style: { marginTop: "4px" } },
              st.error ? "Your work is still saved on this device and will go up once this is fixed." : `Open the same address on your phone and sign in as yourself.${st.at ? ` Last synced ${fmtWhen(st.at)}.` : ""}`
            )
          )
        ),
        el(
          "div.row",
          {},
          el("button", {
            onclick: async () => {
              await pullCloud();
              toast("Refreshed");
              rerender();
            }
          }, icon("cloud", { size: 14 }), " Refresh now"),
          el("button", { onclick: sqlDialog }, "Show setup SQL"),
          el("button.ghost", {
            onclick: async () => {
              const ok = await confirmDialog(
                "Stop syncing this device?",
                "Work already sent stays in the cloud. This device keeps its own copy and stops sending updates.",
                { confirmLabel: "Stop syncing" }
              );
              if (!ok) return;
              disconnectCloud();
              toast("Sync off");
              rerender();
            }
          }, "Stop syncing")
        )
      );
      return el("div.panel", {}, el("header", {}, "Sync across devices"), body);
    }
    const url = el("input", {
      value: cfg?.url || "",
      placeholder: "https://xxxxxxxx.supabase.co",
      autocapitalize: "off",
      spellcheck: false
    });
    const key = el("input", {
      value: cfg?.key || "",
      placeholder: "anon public key",
      autocapitalize: "off",
      spellcheck: false
    });
    const site = el("input", { value: cfg?.site || "cutting", placeholder: "cutting" });
    body.append(
      el(
        "p.small.muted",
        { style: { marginTop: 0 } },
        "Connect this device to a free Supabase project and the tracker works on phones too \u2014 statuses, notes, rush, back orders and shift updates all merge line by line, exactly as they do through the shared file."
      ),
      el(
        "ol.small.muted.cloud-steps",
        {},
        el("li", {}, "Make a free project at supabase.com."),
        el(
          "li",
          {},
          "Run the setup SQL once \u2014 ",
          el("button.linkbtn", { onclick: sqlDialog }, "show it"),
          "."
        ),
        el("li", {}, "Copy the Project URL and the anon public key from Settings \u2192 API, and paste them here."),
        el("li", {}, "Do the same on every phone and PC, with the same site name.")
      ),
      el(
        "div.grid",
        { style: { gridTemplateColumns: "repeat(auto-fit,minmax(210px,1fr))", gap: "12px", marginTop: "14px" } },
        el("label.field", {}, el("span", {}, "Project URL"), url),
        el("label.field", {}, el("span", {}, "Anon public key"), key),
        el("label.field", {}, el(
          "span",
          {},
          "Site name",
          el("em.of-total", {}, "same on every device")
        ), site)
      ),
      el(
        "div.row",
        { style: { marginTop: "14px" } },
        el("button.primary", {
          onclick: async (e) => {
            const btn = e.target;
            btn.disabled = true;
            btn.textContent = "Checking\u2026";
            try {
              const where = await connectCloud({
                url: url.value,
                key: key.value,
                site: site.value
              });
              toast(`Syncing with ${where}`);
              rerender();
            } catch (err) {
              btn.disabled = false;
              btn.textContent = "Connect";
              modal("Could not connect", el(
                "div",
                {},
                el("p", {}, err.message),
                el(
                  "p.small.muted",
                  {},
                  "Nothing was changed. Your data is still on this device."
                )
              ));
            }
          }
        }, "Connect")
      )
    );
    return el("div.panel", {}, el("header", {}, "Sync across devices"), body);
  }
  function renderData(rerender) {
    const mm = state.machineMeta || {};
    const slot = (label, key, node) => el(
      "div",
      {},
      el(
        "div.row",
        { style: { marginBottom: "6px" } },
        el("strong.small", {}, label),
        el("span.spacer"),
        mm[key]?.fileName ? el("span.small.muted", {}, `${mm[key].fileName} \xB7 ${fmtNum(mm[key].count)} lines \xB7 ${fmtWhen(mm[key].importedAt)}`) : chip("not loaded", "warn")
      ),
      node
    );
    const importPanel = el(
      "div.panel",
      {},
      el("header", {}, "Schedules"),
      el(
        "div.body",
        {},
        el(
          "p.small.muted",
          { style: { marginTop: 0 } },
          "These two workbooks are the whole source of truth. Re-import either one whenever a new revision comes out \u2014 statuses you have set are kept."
        ),
        el(
          "div.grid",
          { style: { gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: "14px" } },
          slot("Rolling schedule", "rolling", dropZone({
            title: "Rolling workbook",
            hint: "Auto, Manual and Complete sheets",
            onFile: (f) => handleMachineFile(f, "rolling", rerender)
          })),
          slot("CNC schedule", "cnc", dropZone({
            title: "CNC workbook",
            hint: "FOM 1-3, MultiPunch & SAW, CNC & FMC",
            onFile: (f) => handleMachineFile(f, "cnc", rerender)
          }))
        )
      )
    );
    const connected = sharedFileName();
    const sharedBody = el("div.body", {});
    if (!supportsSharedFile()) {
      sharedBody.append(el(
        "div.banner.warn",
        {},
        el(
          "div",
          {},
          el("strong", {}, "This browser cannot open a shared file. "),
          "Chrome or Edge is needed for live sharing. Until then, use Export and Import below to pass data around."
        )
      ));
    } else if (pendingHandle) {
      sharedBody.append(
        el(
          "div.banner.info",
          { style: { marginBottom: "12px" } },
          el("div", {}, `Reconnect to ${pendingHandle.name} \u2014 the browser needs permission again after a restart.`)
        ),
        el("button.primary", {
          onclick: async () => {
            try {
              const name = await grantSharedFile(pendingHandle);
              pendingHandle = null;
              toast(`Connected to ${name}`);
              rerender();
            } catch (e) {
              toast(e.message);
            }
          }
        }, "Reconnect")
      );
    } else if (connected) {
      sharedBody.append(
        el(
          "div.banner.ok",
          { style: { marginBottom: "12px" } },
          el(
            "div",
            {},
            el("strong", {}, "Connected: "),
            connected,
            el(
              "div.small",
              { style: { marginTop: "4px" } },
              "Changes save here automatically. Other people pointing at the same file will pick them up."
            )
          )
        ),
        el(
          "div.row",
          {},
          el("button", {
            onclick: async () => {
              await pullSharedFile();
              toast("Refreshed from shared file");
              rerender();
            }
          }, "Refresh now"),
          el("button.ghost", {
            onclick: () => {
              disconnectSharedFile();
              toast("Disconnected");
              rerender();
            }
          }, "Disconnect")
        )
      );
    } else {
      sharedBody.append(
        el(
          "p.small.muted",
          { style: { marginTop: 0 } },
          "Point everyone at one JSON file on the shared drive (or a synced SharePoint folder) and the department sees the same board. Each person connects once on their own PC."
        ),
        el(
          "div.row",
          {},
          el("button.primary", {
            onclick: async () => {
              try {
                toast(`Connected to ${await connectSharedFile()}`);
                rerender();
              } catch (e) {
                if (e.name !== "AbortError") toast(e.message);
              }
            }
          }, "Open existing shared file"),
          el("button", {
            onclick: async () => {
              try {
                toast(`Created ${await connectSharedFile({ create: true })}`);
                rerender();
              } catch (e) {
                if (e.name !== "AbortError") toast(e.message);
              }
            }
          }, "Create a new one")
        ),
        el(
          "div.banner.warn",
          { style: { marginTop: "12px" } },
          el(
            "div",
            {},
            el("strong", {}, "Two people updating the same line at once: "),
            "the app merges line by line and the most recent update wins for that one line. Separate lines never overwrite each other."
          )
        )
      );
    }
    const sharedPanel = el("div.panel", {}, el("header", {}, "Shared file"), sharedBody);
    const cloudPanel = cloudSection(rerender);
    const backupPanel = el(
      "div.panel",
      {},
      el("header", {}, "Backup & transfer"),
      el(
        "div.body",
        {},
        el(
          "div.row",
          {},
          el("button", {
            onclick: () => {
              download(`cutting-tracker-${(/* @__PURE__ */ new Date()).toISOString().slice(0, 10)}.json`, exportJson());
              toast("Exported");
            }
          }, "Export everything"),
          el("button", {
            onclick: () => {
              const inp = el("input", { type: "file", accept: ".json", style: { display: "none" } });
              inp.addEventListener("change", async () => {
                if (!inp.files[0]) return;
                try {
                  importJson(await inp.files[0].text(), { merge: true });
                  toast("Merged");
                  rerender();
                } catch (e) {
                  toast("Could not read that file");
                }
              });
              document.body.append(inp);
              inp.click();
              inp.remove();
            }
          }, "Import a backup"),
          el("span.spacer"),
          el("button.danger", {
            onclick: async () => {
              if (await confirmDialog(
                "Clear everything on this device?",
                "The loaded schedules and every status set in this browser will be deleted. If you are connected to a shared file, that file is not touched.",
                { confirmLabel: "Clear", danger: true }
              )) {
                resetAll();
                location.reload();
              }
            }
          }, "Clear this device")
        ),
        el(
          "div.small.muted",
          { style: { marginTop: "10px" } },
          "Export writes one JSON file containing the loaded schedules and every status set against them."
        )
      )
    );
    const peopleInput = el("input", { placeholder: "Add a name", style: { maxWidth: "220px" } });
    const peoplePanel = el(
      "div.panel",
      {},
      el("header", {}, "Who is using this"),
      el(
        "div.body",
        {},
        el(
          "div.row",
          { style: { marginBottom: "12px" } },
          peopleInput,
          el("button", {
            onclick: () => {
              const n = peopleInput.value.trim();
              if (!n) return;
              if (!state.people.includes(n)) state.people.push(n);
              if (!state.settings.me) state.settings.me = n;
              save();
              peopleInput.value = "";
              rerender();
            }
          }, "Add")
        ),
        state.people.length ? el("div.tag-row", {}, ...state.people.map((p) => el(
          "span.chip" + (p === me() ? ".ok" : ""),
          {},
          p,
          el("button.ghost.sm", {
            style: { padding: "0 2px", border: "none" },
            onclick: () => {
              state.people = state.people.filter((x) => x !== p);
              if (state.settings.me === p) state.settings.me = state.people[0] || null;
              save();
              rerender();
            }
          }, "\xD7")
        ))) : el("div.small.muted", {}, "No names yet. Add the people on your crew so updates are attributed.")
      )
    );
    return el(
      "div",
      {},
      importPanel,
      el(
        "div.grid.two",
        { style: { marginTop: "16px" } },
        el("div", {}, cloudPanel, sharedPanel),
        el("div", {}, backupPanel, peoplePanel)
      )
    );
  }

  // js/app.js
  var TABS = [
    { key: "rolling", label: "Rolling", render: makeCentreView("Rolling") },
    { key: "fom", label: "FOM", render: makeCentreView("FOM") },
    { key: "cnc", label: "CNC & FMC", render: makeCentreView("CNC") },
    { key: "punch", label: "Multi Punch", render: makeCentreView("Punch") },
    { key: "rush", label: "Rush", render: renderRush },
    { key: "backorders", label: "Back Orders", render: renderBackOrders },
    { key: "shift", label: "Shift Update", render: renderShiftUpdate },
    { key: "setup", label: "Setup", render: renderData }
  ];
  var current = location.hash.slice(1) || "rolling";
  if (!TABS.some((t) => t.key === current)) current = "rolling";
  var root = document.getElementById("app");
  var scheduled = false;
  function go(key) {
    current = key;
    location.hash = key;
    scheduleRender();
    window.scrollTo({ top: 0 });
  }
  function whoAmI() {
    const people = state.people.length ? state.people : [];
    const sel = el(
      "select",
      {
        style: { width: "auto", minWidth: "120px" },
        onchange: (e) => {
          if (e.target.value === "__add") {
            const name = prompt("Your name");
            if (name && name.trim()) {
              const n = name.trim();
              if (!state.people.includes(n)) state.people.push(n);
              state.settings.me = n;
              save();
            }
            scheduleRender();
            return;
          }
          state.settings.me = e.target.value || null;
          save();
          scheduleRender();
        }
      },
      el("option", { value: "", selected: !state.settings.me }, "Who are you?"),
      ...people.map((p) => el("option", { value: p, selected: state.settings.me === p }, p)),
      el("option", { value: "__add" }, "+ Add name\u2026")
    );
    return sel;
  }
  function header() {
    const shift = SHIFTS[shiftAt()];
    const shared = sharedFileName();
    return el(
      "header.top",
      {},
      el(
        "div.brand",
        {},
        "Cutting",
        el("small", {}, "BV Glazing \xB7 production tracker")
      ),
      el(
        "span.chip" + (shift.full ? "" : ".warn"),
        { title: "Current shift" },
        shift.label + (shift.full ? "" : ` \xB7 ${shift.crew} crew`)
      ),
      cloudEnabled() ? chip("synced", "ok", "Syncing across devices via " + cloudHost()) : shared ? chip("shared file", "ok", "Connected to " + shared) : chip(
        "this device only",
        "mute",
        "Not syncing \u2014 updates stay on this device. Set it up under Setup."
      ),
      el("nav.tabs", {}, ...TABS.map((t) => el("button", {
        "aria-current": String(t.key === current),
        onclick: () => go(t.key)
      }, t.label))),
      el("div", { style: { marginLeft: "8px" } }, whoAmI())
    );
  }
  function render() {
    const tab = TABS.find((t) => t.key === current) || TABS[0];
    const next = el("main", {}, tab.render(scheduleRender, go));
    root.replaceChildren(header(), next);
  }
  function scheduleRender() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      render();
    });
  }
  window.addEventListener("hashchange", () => {
    const k = location.hash.slice(1);
    if (TABS.some((t) => t.key === k) && k !== current) {
      current = k;
      scheduleRender();
    }
  });
  loadLocal();
  onChange(scheduleRender);
  render();
  initSharedFile(render);
  initCloud();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (sharedFileName()) pullSharedFile();
    if (cloudEnabled()) pullCloud({ parts: ["work"] });
  });
})();

</script>
</body>
</html>
