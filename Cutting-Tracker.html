<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutting — BV Glazing Production Tracker</title>
  <style>
/* BV Cutting — department tracker */

:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #fafbfc;
  --line: #dfe4ea;
  --line-soft: #eceff3;
  --ink: #16202b;
  --ink-2: #5b6b7c;
  --ink-3: #8b9aab;
  --accent: #1f6feb;
  --accent-soft: #e8f0fe;
  --ok: #1a7f4b;
  --ok-soft: #e4f5ec;
  --warn: #a8620a;
  --warn-soft: #fdf1de;
  --bad: #c0341d;
  --bad-soft: #fdeae6;
  --work: #6b3fc4;
  --work-soft: #f0eafc;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b;
    --panel: #171f27;
    --panel-2: #1c252e;
    --line: #2b3742;
    --line-soft: #232d37;
    --ink: #e6edf3;
    --ink-2: #9db0c2;
    --ink-3: #6e8296;
    --accent: #4d94ff;
    --accent-soft: #16283f;
    --ok: #4ac98a;
    --ok-soft: #123122;
    --warn: #e0a44a;
    --warn-soft: #33260f;
    --bad: #ff7a63;
    --bad-soft: #3a1a14;
    --work: #b092f0;
    --work-soft: #241a3d;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* ---------- layout ---------- */

.app { display: flex; flex-direction: column; min-height: 100vh; }

header.top {
  position: sticky; top: 0; z-index: 40;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}

.brand { font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 500; color: var(--ink-3); font-size: 12px; }

nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
nav.tabs button {
  border: 1px solid transparent; background: none; color: var(--ink-2);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500;
}
nav.tabs button:hover { background: var(--panel-2); color: var(--ink); }
nav.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }

main { flex: 1; padding: 18px; max-width: 1500px; width: 100%; margin: 0 auto; }

/* ---------- primitives ---------- */

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.panel + .panel { margin-top: 16px; }
.panel > h2, .panel > header {
  margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
  font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2);
  display: flex; align-items: center; gap: 10px; font-weight: 600;
}
.panel > header h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.panel .body { padding: 16px; }
.panel .body.flush { padding: 0; }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { margin-left: auto; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

button, .btn {
  font: inherit; font-weight: 500; cursor: pointer;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px;
}
button:hover:not(:disabled) { border-color: var(--ink-3); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
button.ghost { border-color: transparent; background: none; color: var(--ink-2); }
button.ghost:hover { background: var(--panel-2); color: var(--ink); }
button.sm { padding: 4px 9px; font-size: 12px; }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { resize: vertical; min-height: 70px; line-height: 1.55; }
label.field { display: block; }
label.field > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line-soft);
  white-space: nowrap;
}
.chip.ok   { background: var(--ok-soft);   color: var(--ok);   border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad  { background: var(--bad-soft);  color: var(--bad);  border-color: transparent; }
.chip.work { background: var(--work-soft); color: var(--work); border-color: transparent; }
.chip.mute { background: var(--panel-2);   color: var(--ink-3); }

.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }

/* ---------- stats ---------- */

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 1px; background: var(--line-soft); }
.stat { background: var(--panel); padding: 12px 14px; }
.stat .n { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-top: 2px; font-weight: 600; }
.stat.bad .n { color: var(--bad); }
.stat.warn .n { color: var(--warn); }
.stat.ok .n { color: var(--ok); }

/* ---------- tables ---------- */

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th {
  position: sticky; top: 0; background: var(--panel-2); z-index: 2;
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3);
  font-weight: 600; white-space: nowrap;
}
tbody tr:hover { background: var(--panel-2); }
tbody tr.sel { background: var(--accent-soft); }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }

/* ---------- progress ---------- */

.bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; min-width: 54px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.done > i { background: var(--ok); }

.oprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.oprow:last-child { border-bottom: 0; }
.oplabel { width: 120px; font-weight: 600; font-size: 12.5px; flex-shrink: 0; }
.opqty { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); width: 86px; text-align: right; flex-shrink: 0; }
.opinput { width: 76px; flex-shrink: 0; }
.opinput input { padding: 5px 8px; text-align: right; font-family: var(--mono); }

/* ---------- misc ---------- */

.empty { padding: 34px 16px; text-align: center; color: var(--ink-3); }
.empty h3 { margin: 0 0 6px; color: var(--ink-2); font-size: 15px; }

.drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 34px; text-align: center; color: var(--ink-2); background: var(--panel-2);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.info { background: var(--accent-soft); color: var(--accent); }

dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink);
  max-width: 640px; width: calc(100% - 32px); box-shadow: 0 18px 50px rgba(0,0,0,.24);
}
dialog::backdrop { background: rgba(8,12,16,.5); }
dialog header { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); font-weight: 600; display: flex; align-items: center; }
dialog .body { padding: 18px; max-height: 65vh; overflow: auto; }
dialog footer { padding: 12px 18px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; }

.doc { line-height: 1.65; }
.doc h3 { margin: 18px 0 6px; font-size: 15px; }
.doc h4 { margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
.doc li { margin: 3px 0; }
.doc p { margin: 8px 0; }
.doc code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 500; z-index: 100; box-shadow: 0 8px 26px rgba(0,0,0,.28);
}

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.list li:last-child { border-bottom: 0; }

.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- phone ---------- */

@media (max-width: 720px) {
  main { padding: 12px; }
  header.top { padding: 9px 12px; gap: 8px; }
  nav.tabs { width: 100%; margin-left: 0; overflow-x: auto; }
  nav.tabs button { padding: 7px 11px; font-size: 13px; }
  .hide-sm { display: none !important; }
  .oplabel { width: 88px; }
  .stat .n { font-size: 19px; }
}

/* ---------- work-centre page ---------- */

.centre { padding-bottom: 90px; animation: pagein .18s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.centre-head {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding: 14px 0 12px;
  margin: -18px 0 4px;
  border-bottom: 1px solid var(--line);
}
.centre-title-row { gap: 16px; }
.centre-title { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -0.02em; }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; border-radius: 7px;
  background: none; border: 1px solid transparent; color: var(--ink-3); cursor: pointer;
  transition: color .12s, background .12s, border-color .12s;
}
.iconbtn:hover { color: var(--ink); background: var(--panel-2); border-color: var(--line); }

.centre-stats { display: flex; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden; }
.cstat { background: var(--panel); padding: 7px 15px; text-align: center; min-width: 64px; }
.cstat b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.cstat i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; margin-top: 1px; }
.cstat.bad b { color: var(--bad); }
.cstat.work b { color: var(--work); }

.progress { height: 4px; border-radius: 999px; background: var(--line-soft); overflow: hidden; margin-top: 12px; }
.progress > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s cubic-bezier(.4,0,.2,1); }
.progress-cap { font-size: 11px; color: var(--ink-3); margin-top: 4px; font-weight: 500; }

/* sub-tabs */

.subtabs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 13px; }
.subtabs button {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer;
  transition: background .14s, color .14s, border-color .14s, transform .1s;
}
.subtabs button:hover { border-color: var(--ink-3); color: var(--ink); }
.subtabs button:active { transform: scale(.97); }
.subtabs button[aria-current="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 1px 5px color-mix(in srgb, var(--accent) 35%, transparent);
}
.subtab-count {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.subtabs button[aria-current="true"] .subtab-count { background: rgba(255,255,255,.24); color: #fff; }

/* filters */

.centre-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.searchwrap { position: relative; flex-shrink: 0; }
.searchwrap input { width: 260px; padding-left: 32px; }
.searchicon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }

.filterpills { display: flex; gap: 4px; flex-wrap: wrap; }
.pill {
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: none; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill[aria-current="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.donetoggle { gap: 6px; color: var(--ink-2); cursor: pointer; }
.donetoggle input { width: auto; }

/* date groups */

.dgroup { margin-top: 18px; }
.dgroup-head { display: flex; align-items: center; gap: 8px; padding: 2px; }
.dgroup-toggle {
  display: flex; align-items: center; gap: 9px;
  background: none; border: none; padding: 3px 2px; cursor: pointer; font: inherit;
}
.dgroup-caret { color: var(--ink-3); display: inline-flex; transition: transform .18s cubic-bezier(.4,0,.2,1); }
.dgroup-caret.open { transform: rotate(90deg); }
.dgroup-label {
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-2); transition: color .12s;
}
.dgroup-toggle:hover .dgroup-label { color: var(--ink); }
.dgroup-label.bad { color: var(--bad); }
.dgroup-label.warn { color: var(--warn); }
.dgroup-count {
  font-size: 11px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums;
  background: var(--panel-2); border: 1px solid var(--line-soft);
  padding: 1px 8px; border-radius: 999px;
}
.dgroup-pick {
  background: none; border: none; color: var(--ink-3); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 3px 8px; border-radius: 6px;
}
.dgroup-pick:hover { color: var(--accent); background: var(--accent-soft); }
.dgroup-body {
  margin-top: 7px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
  box-shadow: 0 1px 2px rgba(16,24,32,.04);
}

/* a scheduled line */

.line {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 14px; border-bottom: 1px solid var(--line-soft);
  transition: background .12s;
}
.line:last-of-type { border-bottom: 0; }
.line:hover { background: var(--panel-2); }
.line.sel { background: var(--accent-soft); }

.line-pick { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
.line-pick input { width: 17px; height: 17px; cursor: pointer; accent-color: var(--accent); }

.line-main { flex: 1; min-width: 0; }
.line-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.line-id .mono { font-size: 14.5px; letter-spacing: -0.01em; }
.die {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 7px; border-radius: 5px; letter-spacing: -0.01em;
}
.badge-bo {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .04em;
  background: var(--bad-soft); color: var(--bad); padding: 2px 7px; border-radius: 5px;
}
.line-where { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.line-note { margin-top: 3px; }
.line-usernote {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 5px;
  font-size: 12.5px; color: var(--ink-2);
  background: var(--warn-soft); border-radius: 6px; padding: 4px 8px;
}
.line-usernote svg { flex-shrink: 0; margin-top: 2px; color: var(--warn); }

.line-qty { flex-shrink: 0; text-align: right; min-width: 62px; display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
.line-qty .mono { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.line-date { flex-shrink: 0; width: 68px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }

.line-tools { flex-shrink: 0; display: flex; gap: 2px; }
.line-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border-radius: 7px;
  background: none; border: 1px solid transparent; color: var(--ink-3); cursor: pointer;
  transition: color .12s, background .12s, border-color .12s;
}
.line-iconbtn:hover { color: var(--ink); background: var(--panel); border-color: var(--line); }
.line-iconbtn.has { color: var(--warn); }

/* segmented status control */

.line-status { flex-shrink: 0; }
.seg {
  display: inline-flex; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px;
}
.seg-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: 7px; border: none; background: none;
  color: var(--ink-3); font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
}
.seg-btn:hover { color: var(--ink); background: var(--panel); }
.seg-btn .seg-label { display: none; }
.seg-btn.on { background: var(--panel); box-shadow: 0 1px 3px rgba(16,24,32,.12); }
.seg-btn.on .seg-label { display: inline; }
.seg-btn.on.mute { color: var(--ink-2); }
.seg-btn.on.work { color: var(--work); background: var(--work-soft); box-shadow: none; }
.seg-btn.on.ok   { color: var(--ok);   background: var(--ok-soft);   box-shadow: none; }

.showmore { margin: 10px 14px 12px; }

/* bulk action bar */

.bulkbar {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; z-index: 60;
  background: var(--ink); color: var(--bg);
  padding: 9px 10px 9px 18px; border-radius: 999px;
  box-shadow: 0 10px 34px rgba(0,0,0,.3);
  animation: bulkin .18s cubic-bezier(.4,0,.2,1);
}
@keyframes bulkin { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.bulk-count { font-size: 13px; font-weight: 600; white-space: nowrap; }
.bulkbar .spacer { margin-left: 4px; }
.bulk-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.14); border: none; color: inherit;
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .12s;
}
.bulk-btn:hover { background: rgba(255,255,255,.28); }
.bulk-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border-radius: 999px;
  background: none; border: none; color: inherit; opacity: .65; cursor: pointer;
}
.bulk-x:hover { opacity: 1; background: rgba(255,255,255,.14); }

/* shift update */

.su {
  margin-top: 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
  box-shadow: 0 1px 2px rgba(16,24,32,.04);
}
.su.down { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.su-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
  background: var(--panel-2);
}
.su-title { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.badge-down {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  background: var(--bad); color: #fff; padding: 3px 9px; border-radius: 999px;
}
.su-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; padding: 13px 15px; }
.su-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 5px; }
.su-list { margin: 0; padding-left: 17px; font-size: 13px; line-height: 1.65; }
.su-list li { margin: 2px 0; }

/* empty state */

.empty-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--panel-2); color: var(--ink-3); margin-bottom: 12px;
}

/* toast with an action */

.toast-action { display: flex; align-items: center; gap: 14px; padding-right: 8px; }
.toast-action button {
  background: rgba(255,255,255,.18); border: none; color: inherit;
  padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.toast-action button:hover { background: rgba(255,255,255,.32); }

@media (max-width: 860px) {
  .seg-btn { padding: 8px 9px; }
  .seg-btn.on .seg-label { display: none; }
}

@media (max-width: 720px) {
  .centre-head { position: static; margin: -12px 0 4px; }
  .centre-title { font-size: 19px; }
  .centre-stats { width: 100%; }
  .cstat { flex: 1; min-width: 0; padding: 7px 4px; }
  .searchwrap { flex: 1; }
  .searchwrap input { width: 100%; }
  .line { flex-wrap: wrap; gap: 9px; padding: 12px; }
  .line-main { flex-basis: calc(100% - 34px); }
  .line-status { margin-left: auto; }
  .seg-btn { padding: 9px 12px; }
  .bulkbar { left: 12px; right: 12px; transform: none; border-radius: 14px; }
  @keyframes bulkin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- edited lines & history ---------- */

.badge-edited {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent);
  padding: 2px 7px; border-radius: 5px;
}
.die.edited { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }

.edithead {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft);
}
.editfield > span { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.edited-tag {
  font-style: normal; font-size: 10.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  padding: 1px 6px; border-radius: 4px;
}

.hist-title {
  margin: 20px 0 8px; font-size: 12px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2);
}
.hist {
  list-style: none; margin: 0; padding: 0;
  border: 1px solid var(--line-soft); border-radius: 8px;
  max-height: 240px; overflow: auto;
}
.hist li { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.hist li:last-child { border-bottom: 0; }
.hist-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.hist-kind {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); min-width: 54px;
}
.hist-field {
  font-family: var(--mono); font-size: 11.5px;
  background: var(--panel-2); padding: 1px 6px; border-radius: 4px; color: var(--ink-2);
}
.hist-change { color: var(--ink); }
.hist-who { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* ---------- back orders ---------- */

.line-boband {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 5px;
  font-size: 12.5px; color: var(--bad);
  background: var(--bad-soft); border-radius: 6px; padding: 4px 8px;
}
.line-boband svg { flex-shrink: 0; margin-top: 2px; }
.line-boband .muted { color: color-mix(in srgb, var(--bad) 65%, var(--ink-3)); }

.line-iconbtn.bo { color: var(--bad); }

.bo-dialoghead {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft);
}
.bo-flagrow {
  gap: 10px; align-items: flex-start; padding: 11px 13px;
  background: var(--bad-soft); border-radius: 8px; cursor: pointer;
}
.bo-flagrow input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--bad); }
.of-total { font-style: normal; color: var(--ink-3); font-weight: 500; margin-left: 5px; }

.bo-who {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 800; letter-spacing: .03em;
  color: var(--ink); text-transform: none;
}
.bo-who.none { color: var(--warn); }

.bo-line .line-main { flex: 1; }
.bo-short { color: var(--bad); font-weight: 700; }
.line-bonote {
  display: flex; align-items: flex-start; gap: 5px; margin-top: 4px;
  font-size: 12.5px; color: var(--ink-2);
}
.line-bonote svg { flex-shrink: 0; margin-top: 2px; color: var(--bad); }
.bo-sheetnote {
  display: flex; align-items: flex-start; gap: 6px; margin-top: 12px;
  font-size: 12.5px; color: var(--ink-2);
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: 7px; padding: 8px 10px;
}
.bo-sheetnote svg { flex-shrink: 0; margin-top: 2px; color: var(--warn); }

              toast("Refreshed from shared file");
              rerender();
            }
          }, "Refresh now"),
          el("button.ghost", {
            onclick: () => {
              disconnectSharedFile();
              toast("Disconnected");
              rerender();
            }
          }, "Disconnect")
        )
      );
    } else {
      sharedBody.append(
        el(
          "p.small.muted",
          { style: { marginTop: 0 } },
          "Point everyone at one JSON file on the shared drive (or a synced SharePoint folder) and the department sees the same board. Each person connects once on their own PC."
        ),
        el(
          "div.row",
          {},
          el("button.primary", {
            onclick: async () => {
              try {
                toast(`Connected to ${await connectSharedFile()}`);
                rerender();
              } catch (e) {
                if (e.name !== "AbortError") toast(e.message);
              }
            }
          }, "Open existing shared file"),
          el("button", {
            onclick: async () => {
              try {
                toast(`Created ${await connectSharedFile({ create: true })}`);
                rerender();
              } catch (e) {
                if (e.name !== "AbortError") toast(e.message);
              }
            }
          }, "Create a new one")
        ),
        el(
          "div.banner.warn",
          { style: { marginTop: "12px" } },
          el(
            "div",
            {},
            el("strong", {}, "Two people updating the same line at once: "),
            "the app merges line by line and the most recent update wins for that one line. Separate lines never overwrite each other."
          )
        )
      );
    }
    const sharedPanel = el("div.panel", {}, el("header", {}, "Shared file"), sharedBody);
    const backupPanel = el(
      "div.panel",
      {},
      el("header", {}, "Backup & transfer"),
      el(
        "div.body",
        {},
        el(
          "div.row",
          {},
          el("button", {
            onclick: () => {
              download(`cutting-tracker-${(/* @__PURE__ */ new Date()).toISOString().slice(0, 10)}.json`, exportJson());
              toast("Exported");
            }
          }, "Export everything"),
          el("button", {
            onclick: () => {
              const inp = el("input", { type: "file", accept: ".json", style: { display: "none" } });
              inp.addEventListener("change", async () => {
                if (!inp.files[0]) return;
                try {
                  importJson(await inp.files[0].text(), { merge: true });
                  toast("Merged");
                  rerender();
                } catch (e) {
                  toast("Could not read that file");
                }
              });
              document.body.append(inp);
              inp.click();
              inp.remove();
            }
          }, "Import a backup"),
          el("span.spacer"),
          el("button.danger", {
            onclick: async () => {
              if (await confirmDialog(
                "Clear everything on this device?",
                "The loaded schedules and every status set in this browser will be deleted. If you are connected to a shared file, that file is not touched.",
                { confirmLabel: "Clear", danger: true }
              )) {
                resetAll();
                location.reload();
              }
            }
          }, "Clear this device")
        ),
        el(
          "div.small.muted",
          { style: { marginTop: "10px" } },
          "Export writes one JSON file containing the loaded schedules and every status set against them."
        )
      )
    );
    const peopleInput = el("input", { placeholder: "Add a name", style: { maxWidth: "220px" } });
    const peoplePanel = el(
      "div.panel",
      {},
      el("header", {}, "Who is using this"),
      el(
        "div.body",
        {},
        el(
          "div.row",
          { style: { marginBottom: "12px" } },
          peopleInput,
          el("button", {
            onclick: () => {
              const n = peopleInput.value.trim();
              if (!n) return;
              if (!state.people.includes(n)) state.people.push(n);
              if (!state.settings.me) state.settings.me = n;
              save();
              peopleInput.value = "";
              rerender();
            }
          }, "Add")
        ),
        state.people.length ? el("div.tag-row", {}, ...state.people.map((p) => el(
          "span.chip" + (p === me() ? ".ok" : ""),
          {},
          p,
          el("button.ghost.sm", {
            style: { padding: "0 2px", border: "none" },
            onclick: () => {
              state.people = state.people.filter((x) => x !== p);
              if (state.settings.me === p) state.settings.me = state.people[0] || null;
              save();
              rerender();
            }
          }, "\xD7")
        ))) : el("div.small.muted", {}, "No names yet. Add the people on your crew so updates are attributed.")
      )
    );
    return el(
      "div",
      {},
      importPanel,
      el(
        "div.grid.two",
        { style: { marginTop: "16px" } },
        el("div", {}, sharedPanel),
        el("div", {}, backupPanel, peoplePanel)
      )
    );
  }

  // js/shifts.js
  var SHIFTS = {
    DAY: { key: "DAY", label: "Day", from: 7, to: 15, full: true },
    AFT: { key: "AFT", label: "Afternoon", from: 15, to: 23, full: true },
    NIGHT: { key: "NIGHT", label: "Midnight", from: 23, to: 7, full: false, crew: 3 }
  };
  function shiftAt(date2 = /* @__PURE__ */ new Date()) {
    const h = date2.getHours();
    if (h >= 7 && h < 15) return "DAY";
    if (h >= 15 && h < 23) return "AFT";
    return "NIGHT";
  }

  // js/app.js
  var TABS = [
    { key: "rolling", label: "Rolling", render: makeCentreView("Rolling") },
    { key: "fom", label: "FOM", render: makeCentreView("FOM") },
    { key: "cnc", label: "CNC", render: makeCentreView("CNC") },
    { key: "punch", label: "Multi Punch", render: makeCentreView("Punch") },
    { key: "backorders", label: "Back Orders", render: renderBackOrders },
    { key: "setup", label: "Setup", render: renderData }
  ];
  var current = location.hash.slice(1) || "rolling";
  if (!TABS.some((t) => t.key === current)) current = "rolling";
  var root = document.getElementById("app");
  var scheduled = false;
  function go(key) {
    current = key;
    location.hash = key;
    scheduleRender();
    window.scrollTo({ top: 0 });
  }
  function whoAmI() {
    const people = state.people.length ? state.people : [];
    const sel = el(
      "select",
      {
        style: { width: "auto", minWidth: "120px" },
        onchange: (e) => {
          if (e.target.value === "__add") {
            const name = prompt("Your name");
            if (name && name.trim()) {
              const n = name.trim();
              if (!state.people.includes(n)) state.people.push(n);
              state.settings.me = n;
              save();
            }
            scheduleRender();
            return;
          }
          state.settings.me = e.target.value || null;
          save();
          scheduleRender();
        }
      },
      el("option", { value: "", selected: !state.settings.me }, "Who are you?"),
      ...people.map((p) => el("option", { value: p, selected: state.settings.me === p }, p)),
      el("option", { value: "__add" }, "+ Add name\u2026")
    );
    return sel;
  }
  function header() {
    const shift = SHIFTS[shiftAt()];
    const shared = sharedFileName();
    return el(
      "header.top",
      {},
      el(
        "div.brand",
        {},
        "Cutting",
        el("small", {}, "BV Glazing \xB7 production tracker")
      ),
      el(
        "span.chip" + (shift.full ? "" : ".warn"),
        { title: "Current shift" },
        shift.label + (shift.full ? "" : ` \xB7 ${shift.crew} crew`)
      ),
      shared ? chip("shared file", "ok", "Connected to " + shared) : chip(
        "this device only",
        "mute",
        "Not connected to a shared file \u2014 updates stay on this computer"
      ),
      el("nav.tabs", {}, ...TABS.map((t) => el("button", {
        "aria-current": String(t.key === current),
        onclick: () => go(t.key)
      }, t.label))),
      el("div", { style: { marginLeft: "8px" } }, whoAmI())
    );
  }
  function render() {
    const tab = TABS.find((t) => t.key === current) || TABS[0];
    const next = el("main", {}, tab.render(scheduleRender, go));
    root.replaceChildren(header(), next);
  }
  function scheduleRender() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      render();
    });
  }
  window.addEventListener("hashchange", () => {
    const k = location.hash.slice(1);
    if (TABS.some((t) => t.key === k) && k !== current) {
      current = k;
      scheduleRender();
    }
  });
  loadLocal();
  onChange(scheduleRender);
  render();
  initSharedFile(render);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && sharedFileName()) {
      Promise.resolve().then(() => (init_store(), store_exports)).then((m) => m.pullSharedFile());
    }
  });
})();

</script>
</body>
</html>
