# Publishes the tracker to GitHub Pages so it can be opened on a phone.
#
# The site is the single self-contained Cutting-Tracker.html, served as
# index.html — same file that gets copied to the shared drive, so there is only
# ever one build to trust.
#
# Enable it once: repo Settings -> Pages -> Source: GitHub Actions.
name: Publish tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=optional --ignore-scripts
      - run: node build.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp Cutting-Tracker.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
