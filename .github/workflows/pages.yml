# Publishes the tracker to GitHub Pages so it can be opened on a phone.
#
# The website is the modular PWA assembled in _site. The self-contained
# Cutting-Tracker.html is still rebuilt and tested as the shared-drive rollback
# artifact, but it is not forced through the network on every phone launch.
#
# Enable it once: repo Settings -> Pages -> Source: GitHub Actions.
name: Publish tracker

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runtime stays dependency-free. These pinned development tools exist
      # only to build and verify the self-contained file reproducibly.
      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # The same command developers run locally. The generated sanitized XLSX
      # fixtures keep customer names and work orders out of this public repo.
      - name: Verify audit fixes
        run: node test/audit-fixes-check.mjs

      - name: Verify floor execution workflows
        run: node test/floor-operations-check.mjs && node test/floor-operations-ui-check.mjs

      - name: Verify importer, sync, UI, offline and standalone operation
        run: npm test

      - name: Save the verified offline tracker
        uses: actions/upload-artifact@v4
        with:
          name: offline-tracker
          path: Cutting-Tracker.html
          if-no-files-found: error

      - name: Assemble the modular online app
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  refresh-offline:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: offline-tracker
      - name: Refresh the repository's verified offline download
        env:
          TRACKER_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- Cutting-Tracker.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cutting-Tracker.html
          git commit -m "Refresh verified standalone tracker [skip ci]"
          git push origin "HEAD:$TRACKER_BRANCH"
