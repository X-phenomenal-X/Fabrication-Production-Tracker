# Publishes the tracker to GitHub Pages so it can be opened on a phone.
#
# The site is the single self-contained Cutting-Tracker.html, served as
# index.html — the same file that gets copied to the shared drive, so there is
# only ever one build to trust. It is rebuilt here rather than taken from the
# repo, so the published copy can never be the stale one somebody forgot to
# regenerate.
#
# Enable it once: repo Settings -> Pages -> Source: GitHub Actions.
name: Publish tracker

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publish only from the default branch, whatever it happens to be called.
    # Naming a branch here would silently stop publishing the day the repo is
    # reorganised.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runtime stays dependency-free. These pinned development tools exist
      # only to build and verify the self-contained file reproducibly.
      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # The same command developers run locally. The generated sanitized XLSX
      # fixtures keep customer names and work orders out of this public repo.
      - name: Verify importer, sync, UI, offline and standalone operation
        run: npm test

      - name: Warn if the committed build is stale
        run: |
          if ! git diff --quiet -- Cutting-Tracker.html; then
            echo "::warning::Cutting-Tracker.html in the repo differs from a fresh build."
            echo "The published site is correct, but the copy on the shared drive is out of date —" >> "$GITHUB_STEP_SUMMARY"
            echo "run \`node build.mjs\` and commit the result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp Cutting-Tracker.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          # The worker's cache name is stamped with the commit, so a deploy
          # retires the previous cache instead of sitting alongside it.
          sed "s/__BUILD__/${GITHUB_SHA::12}/" sw.js > _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
